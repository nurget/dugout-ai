services:
  postgres:
    image: postgres:17
    container_name: dugout-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: dugout
      POSTGRES_USER: dugout
      POSTGRES_PASSWORD: dugout_local_password

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dugout -d dugout"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: